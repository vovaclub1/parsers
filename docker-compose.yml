services:
  delist:
    image: sseconddooption/delist
    environment:
      - PYTHONPATH=/Parsers
      - PYTHONUNBUFFERED=1
      - HEARTBEAT_FILE=/tmp/delist_heartbeat
    volumes:
      - /root/Parsers/.env:/Parsers/.env
      - /root/Parsers/delist_session.session:/Parsers/delist_session.session
      # FIX-AUDIT: L2-дедуп («эту монету уже шортили») хранится в
      # $SESSION_DIR/delist_fired.json. Без монтирования файл жил внутри
      # контейнера и стирался при каждом `docker compose up --force-recreate`
      # / обновлении образа — после чего бот мог повторно открыть шорт по
      # уже отработанной монете. Монтируем каталог состояния наружу.
      - /root/Parsers/state:/Parsers/state
    restart: always
    # FIX: реальный healthcheck — проверяет что heartbeat-файл свежий (< 5мин).
    # Парсер пишет touch(/tmp/delist_heartbeat) раз в минуту.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/delist_heartbeat && [ $$(($$(date +%s) - $$(stat -c %Y /tmp/delist_heartbeat))) -lt 300 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # FIX-AUDIT: ограничиваем ресурсы — при утечке памяти в WS-клиенте
    # контейнер не должен утащить весь хост в OOM.
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    command: ["python", "-u", "parsers/parser_delist.py"]

  listing:
    image: sseconddooption/listing
    environment:
      - PYTHONPATH=/Parsers
      - PYTHONUNBUFFERED=1
      - HEARTBEAT_FILE=/tmp/listing_heartbeat
    volumes:
      - /root/Parsers/.env:/Parsers/.env
      - /root/Parsers/listing_session.session:/Parsers/listing_session.session
      # FIX-AUDIT: см. комментарий выше — listing_fired.json обязан переживать
      # пересоздание контейнера, иначе L2-дедуп бесполезен.
      - /root/Parsers/state:/Parsers/state
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/listing_heartbeat && [ $$(($$(date +%s) - $$(stat -c %Y /tmp/listing_heartbeat))) -lt 300 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    command: ["python", "-u", "parsers/parser_listing.py"]

  # FIX: arbitrage был объявлен, но parser_arbitrage.py отсутствовал в проекте.
