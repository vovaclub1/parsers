services:
  delist:
    image: sseconddooption/delist
    environment:
      - PYTHONPATH=/Parsers
      - PYTHONUNBUFFERED=1
      - HEARTBEAT_FILE=/tmp/delist_heartbeat
      # FIX 2026-06-02: L2-дедуп (delist_fired.json) живёт в /Parsers/state,
      # примонтированном как volume — иначе теряется при --force-recreate.
      - STATE_DIR=/Parsers/state
    volumes:
      - /root/Parsers/.env:/Parsers/.env
      - /root/Parsers/delist_session.session:/Parsers/delist_session.session
      # Директория (не пофайлово): атомарный tmp.replace() в _persist_fired_state
      # требует tmp и target в одном mount — иначе EXDEV.
      - /root/Parsers/state:/Parsers/state
    restart: always
    # FIX: реальный healthcheck — проверяет что heartbeat-файл свежий (< 5мин).
    # Парсер пишет touch(/tmp/delist_heartbeat) раз в минуту.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/delist_heartbeat && [ $$(($$(date +%s) - $$(stat -c %Y /tmp/delist_heartbeat))) -lt 300 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["python", "-u", "parsers/parser_delist.py"]

  listing:
    image: sseconddooption/listing
    environment:
      - PYTHONPATH=/Parsers
      - PYTHONUNBUFFERED=1
      - HEARTBEAT_FILE=/tmp/listing_heartbeat
      # FIX 2026-06-02: L2-дедуп (listing_fired.json) + source_stats.json живут
      # в /Parsers/state как volume — иначе теряются при --force-recreate
      # (инцидент: SLX открылся повторно после потери состояния).
      - STATE_DIR=/Parsers/state
    volumes:
      - /root/Parsers/.env:/Parsers/.env
      - /root/Parsers/listing_session.session:/Parsers/listing_session.session
      # Директория (не пофайлово): атомарный tmp.replace() требует tmp и target
      # в одном mount — иначе EXDEV.
      - /root/Parsers/state:/Parsers/state
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/listing_heartbeat && [ $$(($$(date +%s) - $$(stat -c %Y /tmp/listing_heartbeat))) -lt 300 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["python", "-u", "parsers/parser_listing.py"]

